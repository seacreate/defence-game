<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>크리스탈 가드 · 타워 디펜스</title>
<style>
  :root{
    --bg:#070b16;
    --panel:rgba(15,23,42,.9);
    --line:rgba(122,170,255,.16);
    --txt:#e8eefc;
    --dim:#8fa2c8;
    --gold:#ffd166;
    --accent:#38bdf8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    color:var(--txt);
    background:
      radial-gradient(900px 600px at 10% -10%, rgba(56,189,248,.16), transparent 60%),
      radial-gradient(900px 700px at 95% 110%, rgba(192,132,252,.14), transparent 60%),
      var(--bg);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    width:min(1120px,100%,calc((100dvh - 190px) * 1.6667));
    display:flex;flex-direction:column;gap:10px;
  }

  /* ---------- top bar ---------- */
  #topbar{
    display:flex;align-items:center;gap:12px;
    padding:9px 13px;border-radius:16px;
    background:linear-gradient(180deg,rgba(22,33,58,.94),rgba(11,17,32,.94));
    border:1px solid var(--line);
    box-shadow:0 16px 40px rgba(0,0,0,.35);
  }
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand .logo{
    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;
    background:linear-gradient(135deg,rgba(56,189,248,.26),rgba(192,132,252,.26));
    border:1px solid rgba(125,211,252,.35);
    box-shadow:0 0 24px rgba(56,189,248,.18);
  }
  .brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.01em;white-space:nowrap}
  .brand p{margin:1px 0 0;font-size:9.5px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
  .stats{display:flex;gap:6px;margin-left:auto}
  .stat{
    display:flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
    padding:6px 11px;border-radius:11px;min-width:76px;justify-content:center;
    font-variant-numeric:tabular-nums;transition:border-color .2s,box-shadow .2s;
  }
  .stat span{font-size:13px;line-height:1}
  .stat b{font-size:14px;font-weight:800;letter-spacing:.02em}
  .stat.best{min-width:64px}
  .stat.flash{border-color:#f87171;box-shadow:0 0 0 1px rgba(248,113,113,.5),0 0 22px rgba(248,113,113,.35);animation:shakeIt .3s}
  @keyframes shakeIt{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .controls{display:flex;gap:6px}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);color:var(--txt);font-size:14px;font-weight:800;
    cursor:pointer;display:grid;place-items:center;transition:background .15s,transform .1s;
    font-family:inherit;
  }
  .icon-btn:hover{background:rgba(255,255,255,.09)}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn.on{background:rgba(56,189,248,.16);border-color:rgba(56,189,248,.5);color:#bae6fd}

  /* ---------- stage ---------- */
  #stage{
    position:relative;border-radius:18px;overflow:hidden;
    border:1px solid rgba(122,170,255,.22);
    background:#080d1a;
    box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.02);
  }
  canvas{display:block;width:100%;height:auto;aspect-ratio:5/3;touch-action:none;cursor:crosshair;background:#080d1a}

  #waveInfo{
    position:absolute;top:11px;right:11px;z-index:4;text-align:right;pointer-events:none;
    padding:7px 12px;border-radius:11px;background:rgba(7,12,24,.68);
    border:1px solid rgba(122,170,255,.18);backdrop-filter:blur(6px);
    max-width:60%;
  }
  .wi-top{font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
  .wi-top b{color:#e0f2fe;font-size:11px;letter-spacing:0}
  .wi-list{font-size:11.5px;font-weight:600;color:#c7d7f5;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #hint{
    position:absolute;left:50%;bottom:11px;transform:translateX(-50%);
    z-index:4;pointer-events:none;white-space:nowrap;
    font-size:11px;color:#b9cdec;background:rgba(7,12,24,.72);
    border:1px solid rgba(122,170,255,.16);border-radius:999px;
    padding:6px 12px;backdrop-filter:blur(6px);
    transition:opacity .2s;
  }
  #hint.hidden{opacity:0}

  #waveBanner{
    position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
    z-index:5;pointer-events:none;opacity:0;
    font-size:38px;font-weight:900;letter-spacing:.06em;
    color:#fff;text-shadow:0 0 34px rgba(96,200,255,.9),0 4px 18px rgba(0,0,0,.6);
    white-space:nowrap;
  }
  #waveBanner.boss{color:#ffd0d0;text-shadow:0 0 34px rgba(248,113,113,.95),0 4px 18px rgba(0,0,0,.6)}
  #toast{
    position:absolute;left:50%;top:12px;transform:translate(-50%,-8px);
    z-index:5;pointer-events:none;opacity:0;white-space:nowrap;
    padding:7px 15px;border-radius:999px;
    background:rgba(8,14,28,.82);border:1px solid rgba(125,211,252,.3);
    font-size:12px;font-weight:700;color:#d9f4ff;letter-spacing:.01em;
    backdrop-filter:blur(6px);box-shadow:0 8px 24px rgba(0,0,0,.35);
    transition:opacity .25s ease,transform .25s ease;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #waveBanner.show{animation:bannerPop 1.35s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes bannerPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.82)}
    16%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    72%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-54%) scale(1.04)}
  }

  /* ---------- tower panel ---------- */
  #towerPanel{
    position:absolute;left:11px;bottom:11px;z-index:6;width:262px;
    padding:11px;border-radius:14px;
    background:rgba(9,15,29,.9);border:1px solid rgba(122,170,255,.22);
    backdrop-filter:blur(10px);box-shadow:0 18px 44px rgba(0,0,0,.5);
    animation:panelIn .18s ease;
  }
  @keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #towerPanel.hidden{display:none}
  .tp-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .tp-icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
  .tp-titles{display:flex;flex-direction:column;line-height:1.15;min-width:0}
  .tp-titles b{font-size:13px}
  .tp-titles span{font-size:10px;color:var(--dim);letter-spacing:.08em}
  .tp-close{
    margin-left:auto;width:24px;height:24px;border-radius:7px;border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);color:var(--dim);cursor:pointer;font-size:14px;line-height:1;
  }
  .tp-close:hover{color:#fff;background:rgba(255,255,255,.1)}
  .tp-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:9px}
  .tp-stat{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);
    padding:4px 7px;border-radius:7px;font-size:10.5px;color:var(--dim);
  }
  .tp-stat b{color:#e6f0ff;font-size:11px;font-variant-numeric:tabular-nums}
  .tp-actions{display:flex;gap:6px}
  .tp-actions button{
    flex:1;border-radius:9px;border:1px solid rgba(255,255,255,.08);padding:7px 8px;
    font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;
    background:rgba(255,255,255,.05);color:var(--txt);transition:background .15s,opacity .15s;
  }
  .tp-actions button span{color:var(--gold)}
  #upgradeBtn{background:linear-gradient(135deg,rgba(56,189,248,.24),rgba(129,140,248,.24));border-color:rgba(96,165,250,.45)}
  #upgradeBtn:hover:not(:disabled){background:linear-gradient(135deg,rgba(56,189,248,.34),rgba(129,140,248,.34))}
  .tp-actions button:disabled{opacity:.38;cursor:default}
  #sellBtn:hover{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.35)}

  /* ---------- pause ---------- */
  #pauseOverlay{
    position:absolute;inset:0;z-index:8;display:grid;place-items:center;text-align:center;
    background:rgba(3,7,16,.58);backdrop-filter:blur(3px);
  }
  #pauseOverlay.hidden{display:none}
  #pauseOverlay b{display:block;font-size:26px;letter-spacing:.1em;text-shadow:0 0 26px rgba(96,200,255,.6)}
  #pauseOverlay p{margin:6px 0 0;font-size:12px;color:var(--dim)}

  /* ---------- shop ---------- */
  #shop{
    display:flex;gap:7px;align-items:stretch;flex-wrap:wrap;
    padding:9px;border-radius:16px;
    background:linear-gradient(180deg,rgba(22,33,58,.92),rgba(11,17,32,.92));
    border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.3);
  }
  .card{
    position:relative;display:flex;align-items:center;gap:7px;flex:1 1 132px;min-width:120px;
    padding:7px 9px;border-radius:11px;border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.035);color:var(--txt);cursor:pointer;
    text-align:left;font-family:inherit;transition:background .15s,transform .1s,border-color .15s,box-shadow .15s;
  }
  .card:hover{background:rgba(255,255,255,.07);transform:translateY(-1px)}
  .card.selected{
    border-color:rgba(56,189,248,.75);background:rgba(56,189,248,.12);
    box-shadow:0 0 0 1px rgba(56,189,248,.5),0 8px 24px rgba(56,189,248,.18);
  }
  .card.disabled{opacity:.42}
  .c-icon{
    width:33px;height:33px;flex:0 0 auto;display:grid;place-items:center;border-radius:9px;
    font-size:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  }
  .c-text{display:flex;flex-direction:column;min-width:0;line-height:1.2}
  .c-text b{font-size:12.5px;white-space:nowrap}
  .c-text i{font-style:normal;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-cost{
    margin-left:auto;font-size:11.5px;font-weight:800;color:var(--gold);
    background:rgba(255,209,102,.1);padding:2px 6px;border-radius:999px;
    border:1px solid rgba(255,209,102,.2);flex:0 0 auto;
  }
  #startBtn{
    flex:0 0 auto;min-width:158px;border:none;border-radius:12px;padding:10px 16px;
    font-family:inherit;font-weight:900;font-size:13.5px;letter-spacing:.02em;color:#03121f;
    background:linear-gradient(135deg,#67e8f9,#60a5fa 55%,#a78bfa);
    cursor:pointer;box-shadow:0 8px 26px rgba(96,165,250,.35);
    transition:transform .1s,filter .15s,opacity .2s;
  }
  #startBtn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}
  #startBtn:active:not(:disabled){transform:translateY(0)}
  #startBtn:disabled{opacity:.45;cursor:default;box-shadow:none}

  /* ---------- modal ---------- */
  #overlay{
    position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
    background:rgba(3,7,15,.72);backdrop-filter:blur(10px);
  }
  #overlay.hidden{display:none}
  .modal{
    width:min(470px,100%);padding:30px 28px 24px;border-radius:24px;text-align:center;
    background:linear-gradient(180deg,#15213c,#0b1326);
    border:1px solid rgba(122,170,255,.26);
    box-shadow:0 40px 100px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
    animation:modalIn .35s cubic-bezier(.2,.9,.25,1.1);
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  .modal-icon{
    width:68px;height:68px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;font-size:32px;
    background:linear-gradient(135deg,rgba(56,189,248,.22),rgba(192,132,252,.22));
    border:1px solid rgba(125,211,252,.4);
    box-shadow:0 0 40px rgba(56,189,248,.22),inset 0 0 24px rgba(56,189,248,.1);
  }
  .modal h2{
    margin:0 0 8px;font-size:27px;letter-spacing:.01em;font-weight:900;
    background:linear-gradient(120deg,#e0f2fe,#93c5fd 45%,#d8b4fe);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .modal p.sub{margin:0 0 18px;font-size:12.5px;line-height:1.65;color:#a9bcda}
  .ov-stats{display:flex;gap:7px;margin:0 0 18px}
  .ov-stats>div{
    flex:1;padding:10px 6px;border-radius:12px;background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:3px;
  }
  .ov-stats span{font-size:9.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
  .ov-stats b{font-size:15px;font-variant-numeric:tabular-nums}
  #ovBtn{
    width:100%;border:none;border-radius:13px;padding:13px;cursor:pointer;
    font-family:inherit;font-weight:900;font-size:15px;color:#03121f;
    background:linear-gradient(135deg,#67e8f9,#60a5fa 55%,#a78bfa);
    box-shadow:0 12px 34px rgba(96,165,250,.38);
    transition:transform .1s,filter .15s;
  }
  #ovBtn:hover{transform:translateY(-1px);filter:brightness(1.07)}
  #ovBtn:active{transform:translateY(0)}
  #ovHint{margin:12px 0 0;font-size:10.5px;color:#7186a8;letter-spacing:.02em}

  @media (max-width:980px){
    .c-text i{display:none}
    .card{flex-basis:112px;min-width:104px}
  }
  @media (max-width:600px){
    #topbar{flex-wrap:wrap;row-gap:6px}
    .brand{flex:1 1 auto}
    .controls{margin-left:0}
    .stats{order:3;width:100%;margin-left:0;gap:5px}
    .stat{flex:1}
    .stat.best{display:none}
    #towerPanel{left:8px;right:8px;width:auto}
    #stage{border-radius:14px}
  }
  @media (max-width:760px){
    body{padding:8px}
    .brand p{display:none}
    .brand h1{font-size:14px}
    .brand .logo{width:32px;height:32px;font-size:16px;border-radius:10px}
    .stat{min-width:0;padding:5px 8px;gap:4px}
    .stat b{font-size:12px}
    .stat span{font-size:11px}
    .stat.best{display:none}
    .controls{gap:4px}
    .icon-btn{width:31px;height:31px;font-size:12px;border-radius:8px}
    #topbar{gap:8px;padding:7px 9px}
    #towerPanel{width:238px;left:8px;bottom:8px;padding:9px}
    #waveInfo{top:8px;right:8px;padding:5px 9px;max-width:55%}
    .wi-list{font-size:10.5px}
    #hint{bottom:8px;font-size:10px;padding:5px 10px;max-width:92%;overflow:hidden;text-overflow:ellipsis}
    .card{min-width:118px;flex:1 1 118px;padding:6px 7px}
    .c-icon{width:28px;height:28px;font-size:14px}
    .c-text i{display:none}
    #startBtn{min-width:100%;padding:10px;font-size:13px}
    #waveBanner{font-size:28px}
    .modal{padding:24px 18px 20px}
    .modal h2{font-size:23px}
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <div class="logo">🛡️</div>
      <div>
        <h1>크리스탈 가드</h1>
        <p>Tower Defense</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat" id="livesStat"><span>❤️</span><b id="lives">20</b></div>
      <div class="stat" id="goldStat"><span>💰</span><b id="gold">260</b></div>
      <div class="stat"><span>🌊</span><b id="wave">0/20</b></div>
      <div class="stat best"><span>🏆</span><b id="best">0</b></div>
    </div>
    <div class="controls">
      <button class="icon-btn" id="speedBtn" title="게임 속도 (F)">1×</button>
      <button class="icon-btn" id="pauseBtn" title="일시정지 (P)">⏸</button>
      <button class="icon-btn on" id="soundBtn" title="소리 켜기/끄기">🔊</button>
      <button class="icon-btn" id="restartBtn" title="다시 시작">↻</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="game" width="1000" height="600"></canvas>
    <div id="waveInfo">
      <div class="wi-top">다음 웨이브 <b>1</b></div>
      <div class="wi-list">슬라임 6</div>
    </div>
    <div id="hint">1–4 타워 선택 · Space 웨이브 시작</div>
    <div id="waveBanner"></div>
    <div id="toast"></div>

    <div id="towerPanel" class="hidden">
      <div class="tp-head">
        <div class="tp-icon" id="tpIcon">🏹</div>
        <div class="tp-titles">
          <b id="tpName">화살탑</b>
          <span id="tpLevel">Lv.1</span>
        </div>
        <button class="tp-close" id="tpClose" title="닫기 (Esc)">✕</button>
      </div>
      <div class="tp-stats" id="tpStats"></div>
      <div class="tp-actions">
        <button id="upgradeBtn">업그레이드</button>
        <button id="sellBtn">판매</button>
      </div>
    </div>

    <div id="pauseOverlay" class="hidden">
      <div>
        <b>⏸ 일시정지</b>
        <p>P 키를 눌러 계속하세요</p>
      </div>
    </div>
  </div>

  <footer id="shop">
    <button class="card" data-type="arrow" title="빠른 단일 공격">
      <span class="c-icon">🏹</span>
      <span class="c-text"><b>화살탑</b><i>빠른 단일 공격</i></span>
      <span class="c-cost">50</span>
    </button>
    <button class="card" data-type="cannon" title="광역 폭발 피해">
      <span class="c-icon">💥</span>
      <span class="c-text"><b>대포</b><i>광역 폭발 피해</i></span>
      <span class="c-cost">90</span>
    </button>
    <button class="card" data-type="frost" title="주변 적 감속">
      <span class="c-icon">❄️</span>
      <span class="c-text"><b>빙결탑</b><i>주변 적 감속</i></span>
      <span class="c-cost">70</span>
    </button>
    <button class="card" data-type="bolt" title="연쇄 번개 공격">
      <span class="c-icon">⚡</span>
      <span class="c-text"><b>번개탑</b><i>연쇄 번개 공격</i></span>
      <span class="c-cost">130</span>
    </button>
    <button id="startBtn">웨이브 1 시작</button>
  </footer>
</div>

<div id="overlay">
  <div class="modal">
    <div class="modal-icon" id="ovIcon">🛡️</div>
    <h2 id="ovTitle">크리스탈 가드</h2>
    <p class="sub" id="ovText">길을 따라 몰려오는 적을 막고 크리스탈을 지켜내세요.<br>20개의 웨이브를 버티면 승리합니다.</p>
    <div class="ov-stats" id="ovStats">
      <div><span>타워 선택</span><b>1 – 4</b></div>
      <div><span>웨이브 시작</span><b>Space</b></div>
      <div><span>일시정지</span><b>P</b></div>
    </div>
    <button id="ovBtn">게임 시작</button>
    <p id="ovHint">타워를 업그레이드하고 크리스탈을 지키세요</p>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
